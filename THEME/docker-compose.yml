name: theme-api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-theme_api}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - theme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4065"
      DATABASE_URL: postgres://${POSTGRES_USER:-theme}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-theme_api}
    ports:
      - "${PORT:-4065}:4065"

volumes:
  theme_pgdata:
